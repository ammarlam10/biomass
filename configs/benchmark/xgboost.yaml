# ─────────────────────────────────────────────────────────────────────────────
# Benchmark config: XGBoost baseline  (3-seed reproducibility study)
#
# Data block is identical to the DL benchmark configs so metrics are comparable.
# save_dir is overridden at launch via --save-dir CLI flag to produce
# per-seed artifacts: /workspace/artifacts/benchmark/xgb/seed_<S>/
#
# Paths use Docker mounts:
#   dataset → /data//4g.zarr  (read-only)
#   code    → /workspace
# ─────────────────────────────────────────────────────────────────────────────

data:
  root: /data//4g.zarr
  split_file: /data//4g.zarr/patch_index_subset.parquet

  split_column: split
  patch_idx_column: zarr_idx

  s1_seasons: [summer, autumn, spring, winter]
  s2_seasons: [summer, autumn, spring, winter]
  use_species: true

  valid_mask_mode: notnull

  target_transform:
    tree_count: log1p
    mean_height: log1p

  norm_stats_path: /workspace/artifacts/norm_stats.json

# Seed for XGBoost random_state and pixel subsampling.
# Overridden per run via --seed CLI flag.
training:
  seed: 42

# ─── XGBoost ──────────────────────────────────────────────────────────────────
xgboost:
  feature_mode: pixel
  subsample_pixels: 0.03

  n_estimators: 2000
  max_depth: 6
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  tree_method: hist
  device: cuda              # GPU 0 inside container (host GPU 4 via docker --gpus)
  early_stopping_rounds: 40

  # Overridden at launch via --save-dir; this fallback is never used by the
  # benchmark runner scripts.
  save_dir: /workspace/artifacts/benchmark/xgb/seed_42
