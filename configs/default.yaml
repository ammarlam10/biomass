# ─────────────────────────────────────────────────────────────────────────────
# Biomass UNet baseline – default configuration
# All paths are relative to the Docker container mounts:
#   data  → /data    (mounted read-only from /work/ammar/sslrp/data/biomass)
#   code  → /workspace  (mounted from /work/ammar/sslrp/biomass)
# ─────────────────────────────────────────────────────────────────────────────

data:
  root: /data
  split_file: /data/patch_index_subset.parquet

  # Column names in the parquet file.
  # Run `scripts/compute_stats.py --inspect` to print available columns if
  # these defaults cause a KeyError.
  split_column: split        # values expected: train / val / test
  patch_idx_column: zarr_idx  # confirmed from patch_index_subset.parquet

  # Which input modalities to use
  s1_seasons: [summer, autumn, spring, winter]   # 4 × 2 bands = 8 ch
  s2_seasons: [summer, autumn, spring, winter]   # 4 × 10 bands = 40 ch
  # Pixel values are categorical class codes (not reflectance); stats use identity norm.
  use_species: true

  # Validity mask strategy:
  #   notnull  – pixel valid when mean_height is non-NaN (tree_count uses 0
  #              for non-tree pixels so it is never NaN; mean_height IS NaN
  #              on non-tree pixels → this correctly selects ~8-9% of pixels)
  #   positive – additionally requires tree_count > 0 (slightly stricter)
  valid_mask_mode: notnull

  # Per-target transforms applied before loss (inverse applied at eval time)
  target_transform:
    tree_count: log1p    # log1p stabilises heavy-tailed count distribution
    mean_height: log1p

  norm_stats_path: /workspace/artifacts/norm_stats.json

# ─── Model ────────────────────────────────────────────────────────────────────
model:
  # Registry key → one of: unet_resnet50 | vit_segmentation | prithvi_adapter
  # XGBoost uses a separate script (scripts/train_xgboost.py)
  name: unet_resnet50

  unet:
    encoder_name: resnet50
    encoder_weights: imagenet   # imagenet pretrained; first conv is adapted
    decoder_channels: [256, 128, 64, 32, 16]

  vit:    {}  # populated when model.name = vit_segmentation
  prithvi: {}  # populated when model.name = prithvi_adapter

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  seed: 42
  deterministic: false         # true → slower but fully reproducible

  # ── Batch / DataLoader ──────────────────────────────────────────────────────
  # Tuned for V100S 32GB. Reduce batch_size to 16 if using P100 16GB.
  batch_size: 32
  # 12 workers saturates ~1 NUMA node (12 physical cores) without cross-NUMA
  # overhead. Use 8 on P100 nodes or if you observe no gain past that point.
  num_workers: 12
  prefetch_factor: 2           # batches queued ahead per worker
  pin_memory: true

  # ── GPU / Distributed ───────────────────────────────────────────────────────
  # cudnn.benchmark: speeds up convolutions for fixed input sizes (128x128).
  # Automatically disabled when deterministic=true.
  cudnn_benchmark: true
  # DDP: set to true when launching via torchrun (see docker-compose train_ddp).
  # Has no effect in single-GPU mode.
  ddp: false

  epochs: 150
  lr: 1.0e-4
  weight_decay: 1.0e-4

  # Scheduler: cosine | onecycle | none
  scheduler: cosine

  # Loss: masked_mse | masked_smooth_l1 | masked_mae
  loss: masked_smooth_l1

  # Per-target loss weighting (tune if one target dominates)
  loss_weights:
    tree_count: 1.0
    mean_height: 1.0

  gradient_accumulation_steps: 1
  amp: true                    # automatic mixed precision (requires CUDA)

  save_dir: /workspace/artifacts/checkpoints

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  tensorboard_dir: /workspace/artifacts/runs
  csv_path: /workspace/artifacts/metrics.csv
  log_every_n_steps: 10
