# ─────────────────────────────────────────────────────────────────────────────
# Experiment A1: Single-Task SegFormer-B3 – mean_height only
#
# Hypothesis: decoupling from noisy tree_count gradients boosts height R²
# above the 0.503 achieved in the multi-task benchmark run.
#
# Changes vs configs/benchmark/segformer_b3.yaml:
#   - data.targets: [mean_height]   ← single output channel
#   - save_dir / logging: under artifacts/experiments/singletask_height_segformer_b3/
#
# Usage (override seed and run-dir per seed):
#   python scripts/train.py \
#     --config configs/experiments/singletask_height_segformer_b3.yaml \
#     --seed 42 \
#     --run-dir /workspace/artifacts/experiments/singletask_height_segformer_b3/seed_42
# ─────────────────────────────────────────────────────────────────────────────

data:
  root: /data//4g.zarr
  split_file: /data//4g.zarr/patch_index_subset.parquet

  split_column: split
  patch_idx_column: zarr_idx

  s1_seasons: [summer, autumn, spring, winter]
  s2_seasons: [summer, autumn, spring, winter]
  use_species: true

  valid_mask_mode: notnull

  targets: [mean_height]        # ← single-task: height only

  target_transform:
    tree_count: log1p
    mean_height: log1p

  norm_stats_path: /workspace/artifacts/norm_stats.json

# ─── Model ────────────────────────────────────────────────────────────────────
model:
  name: vit_segmentation

  vit:
    encoder_name: pvt_v2_b3
    embed_dim: 256
    pretrained: true

  unet:    {}
  prithvi: {}

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  seed: 42
  deterministic: false
  cudnn_benchmark: true
  ddp: false

  batch_size: 8
  num_workers: 12
  prefetch_factor: 2
  pin_memory: true

  epochs: 60
  lr: 6.0e-5
  weight_decay: 1.0e-2

  scheduler: cosine
  loss: masked_smooth_l1

  loss_weights:
    mean_height: 1.0

  gradient_accumulation_steps: 1
  amp: true

  validate_every_n_epochs: 5
  early_stopping_patience: 10

  save_dir: /workspace/artifacts/experiments/singletask_height_segformer_b3/seed_42/checkpoints

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  tensorboard_dir: /workspace/artifacts/experiments/singletask_height_segformer_b3/seed_42/runs
  csv_path: /workspace/artifacts/experiments/singletask_height_segformer_b3/seed_42/metrics.csv
  log_every_n_steps: 10
