# ─────────────────────────────────────────────────────────────────────────────
# Experiment A1: Single-Task Clay v1.5 – mean_height only
#
# Hypothesis: decoupling from tree_count allows Clay to focus its limited
# fine-tuning budget on height, potentially improving R² beyond 0.272.
#
# Training follows the same two-phase schedule as the benchmark:
#
#   Phase 1 – freeze encoder (30 epochs):
#     torchrun --nproc_per_node=2 scripts/train.py \
#       --config configs/experiments/singletask_height_clay.yaml \
#       --freeze-clay-encoder --lr 1e-4 --epochs 30 \
#       --seed 42 \
#       --run-dir /workspace/artifacts/experiments/singletask_height_clay/seed_42/p1
#
#   Phase 2 – unfreeze encoder (30 epochs), resume from Phase 1 best:
#     torchrun --nproc_per_node=2 scripts/train.py \
#       --config configs/experiments/singletask_height_clay.yaml \
#       --no-freeze-clay-encoder --lr 5e-5 --epochs 30 \
#       --resume /workspace/artifacts/experiments/singletask_height_clay/seed_42/p1/checkpoints/best.pt \
#       --seed 42 \
#       --run-dir /workspace/artifacts/experiments/singletask_height_clay/seed_42/p2
#
#   Final test metrics → .../p2/checkpoints/test_metrics.json
# ─────────────────────────────────────────────────────────────────────────────

data:
  root: /data//4g.zarr
  split_file: /data//4g.zarr/patch_index_subset.parquet

  split_column: split
  patch_idx_column: zarr_idx

  s1_seasons: [summer, autumn, spring, winter]
  s2_seasons: [summer, autumn, spring, winter]
  use_species: true

  valid_mask_mode: notnull

  targets: [mean_height]        # ← single-task: height only

  target_transform:
    tree_count: log1p
    mean_height: log1p

  norm_stats_path: /workspace/artifacts/norm_stats.json

# ─── Model ────────────────────────────────────────────────────────────────────
model:
  name: clay_adapter

  clay:
    ckpt_path: /workspace/artifacts/checkpoints/clay-v1.5.ckpt
    metadata_path: /workspace/configs/clay_metadata.yaml
    freeze_encoder: true
    species_feat_dim: 32

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  seed: 42
  deterministic: false
  cudnn_benchmark: true
  ddp: false

  batch_size: 16
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true

  epochs: 30
  lr: 1.0e-4
  weight_decay: 1.0e-4

  scheduler: cosine
  loss: masked_smooth_l1

  loss_weights:
    mean_height: 1.0

  gradient_accumulation_steps: 1
  amp: true

  validate_every_n_epochs: 5
  early_stopping_patience: 10

  save_dir: /workspace/artifacts/experiments/singletask_height_clay/seed_42/p1/checkpoints

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  tensorboard_dir: /workspace/artifacts/experiments/singletask_height_clay/seed_42/p1/runs
  csv_path: /workspace/artifacts/experiments/singletask_height_clay/seed_42/p1/metrics.csv
  log_every_n_steps: 10
