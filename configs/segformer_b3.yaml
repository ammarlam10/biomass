# ─────────────────────────────────────────────────────────────────────────────
# SegFormer-B3 style dense regression
# Encoder: PVTv2-B3 (~45 M params, deeper than B2's ~25 M)
# Decoder: All-MLP head, embed_dim=256 (same as B2 / SegFormer paper)
#
# PVTv2-B3 stage widths: [64, 128, 320, 512] — identical to B2; the decoder
# architecture is therefore unchanged from segformer.yaml.
#
# Paths assume Docker mounts:
#   dataset → /data//4g.zarr  (read-only)
#   code    → /workspace
# ─────────────────────────────────────────────────────────────────────────────

data:
  root: /data/4g.zarr
  split_file: /data/4g.zarr/patch_index_subset.parquet

  split_column: split
  patch_idx_column: zarr_idx

  s1_seasons: [summer, autumn, spring, winter]   # 4 × 2 bands = 8 ch
  s2_seasons: [summer, autumn, spring, winter]   # 4 × 10 bands = 40 ch
  use_species: true                              # +1 ch → 49 total

  valid_mask_mode: notnull

  target_transform:
    tree_count: log1p
    mean_height: log1p

  norm_stats_path: /workspace/artifacts/norm_stats.json

# ─── Model ────────────────────────────────────────────────────────────────────
model:
  name: vit_segmentation

  vit:
    encoder_name: pvt_v2_b3   # ~45 M params, 4 scales [64,128,320,512]
    embed_dim: 256             # MLP decoder width (same as B2)
    pretrained: true

  unet:    {}
  prithvi: {}

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  seed: 42
  deterministic: false

  # PVTv2-B3 is ~80 % heavier than B2 per forward pass.
  # 8 fits on a V100S 32 GB with AMP; raise to 12 only after profiling memory.
  batch_size: 8
  num_workers: 12
  prefetch_factor: 2
  pin_memory: true

  cudnn_benchmark: true
  ddp: false

  epochs: 100
  lr: 6.0e-5
  weight_decay: 1.0e-2

  scheduler: cosine
  loss: masked_smooth_l1

  loss_weights:
    tree_count: 1.0
    mean_height: 1.0

  gradient_accumulation_steps: 1
  amp: true

  validate_every_n_epochs: 5
  early_stopping_patience: 10

  save_dir: /workspace/artifacts/segformer_b3/checkpoints

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  tensorboard_dir: /workspace/artifacts/segformer_b3/runs
  csv_path: /workspace/artifacts/segformer_b3/metrics.csv
  log_every_n_steps: 10
