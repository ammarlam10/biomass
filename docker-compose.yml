

version: "3.9"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-volumes: &volumes
  volumes:
    - /data/path/here:/data/here/4g.zarr:ro
    - /path/to/this/repo:/workspace
    - /path/to/this/repo/artifacts:/workspace/artifacts

services:

  # ── Compute per-channel normalisation statistics ──
  compute_stats:
    build: .
    image: biomass:latest
    <<: [*gpu, *volumes]
    shm_size: '4g'
    environment:
      - CUDA_VISIBLE_DEVICES=2
    command: >
      python scripts/compute_stats.py
        --config configs/unet_resnet50.yaml
        --num_workers 12

  # ── UNet-ResNet50 ─────────────────────────────────────────────────────────────
  train:
    build: .
    image: biomass:latest
    <<: [*gpu, *volumes]
    shm_size: '16g'
    environment:
      - CUDA_VISIBLE_DEVICES=2
    command: >
      python scripts/train.py
        --config configs/unet_resnet50.yaml

  eval:
    build: .
    image: biomass:latest
    <<: [*gpu, *volumes]
    shm_size: '8g'
    environment:
      - CUDA_VISIBLE_DEVICES=2
    command: >
      python scripts/evaluate.py
        --config configs/unet_resnet50.yaml
        --checkpoint /workspace/artifacts/checkpoints/best.pt
        --split test

  # ── SegFormer-B3 ─────────────────────────────────────────────────────────────
  train_segformer_b3:
    build: .
    image: biomass:latest
    <<: [*gpu, *volumes]
    shm_size: '16g'
    environment:
      - CUDA_VISIBLE_DEVICES=2
    command: >
      python scripts/train.py
        --config configs/segformer_b3.yaml
        --run-dir /workspace/artifacts/segformer_b3

  eval_segformer_b3:
    build: .
    image: biomass:latest
    <<: [*gpu, *volumes]
    shm_size: '8g'
    environment:
      - CUDA_VISIBLE_DEVICES=2
    command: >
      python scripts/evaluate.py
        --config configs/segformer_b3.yaml
        --checkpoint /workspace/artifacts/segformer_b3/checkpoints/best.pt
        --split test

  # ── Clay  ───────────────────────────────────────
  train_clay:
    build: .
    image: biomass:latest
    <<: [*gpu, *volumes]
    shm_size: '16g'
    environment:
      - CUDA_VISIBLE_DEVICES=2
    command: >
      python scripts/train.py
        --config configs/clay.yaml
        --run-dir /workspace/artifacts/clay

  eval_clay:
    build: .
    image: biomass:latest
    <<: [*gpu, *volumes]
    shm_size: '8g'
    environment:
      - CUDA_VISIBLE_DEVICES=2
    command: >
      python scripts/evaluate.py
        --config configs/clay.yaml
        --checkpoint /workspace/artifacts/clay/checkpoints/best.pt
        --split test

  # ── XGBoost pixel baseline ────────────────────────────────────────────────────
  train_xgboost:
    build: .
    image: biomass:latest
    <<: [*gpu, *volumes]
    shm_size: '8g'
    environment:
      - CUDA_VISIBLE_DEVICES=2
    command: >
      python scripts/train_xgboost.py
        --config configs/xgboost.yaml

  eval_xgboost:
    build: .
    image: biomass:latest
    <<: [*gpu, *volumes]
    shm_size: '8g'
    environment:
      - CUDA_VISIBLE_DEVICES=2
    command: >
      python scripts/evaluate_xgboost.py
        --config configs/xgboost.yaml
        --model_dir /workspace/artifacts
        --split test
